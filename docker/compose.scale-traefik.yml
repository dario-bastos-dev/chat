# ============================================================
# CHATWOOT + EVOLUTION API - DOCKER COMPOSE COM TRAEFIK
# ============================================================
#
# Este arquivo contém 4 configurações para diferentes escalas:
# 1. DEZENAS (10-50 usuários) - Pequenas empresas
# 2. CENTENAS (100-500 usuários) - Médias empresas
# 3. MILHARES (1000-10000 usuários) - Grandes empresas
# 4. MILHÕES (100k+ usuários) - Enterprise
#
# INSTRUÇÕES:
# 1. Copie a seção desejada para seu compose.yml
# 2. Ajuste as variáveis no arquivo .env
# 3. Execute: docker-compose up -d
#
# PRÉ-REQUISITOS:
# - Traefik rodando (rede externa 'traefik-network')
# - Domínio apontando para o servidor
#
# ============================================================

# ============================================================
# 📌 CONFIGURAÇÃO 1: DEZENAS DE USUÁRIOS (10-50)
# ============================================================
# Servidor mínimo: 2 CPU, 4GB RAM
# Uso: Pequenas empresas, startups, testes
# Capacidade: ~5 req/s, ~100 msg/min
# ============================================================

version: "3.8"

networks:
  traefik-network:
    external: true
  chatwoot-internal:
    driver: bridge

x-base-config: &base-config
  FRONTEND_URL: https://${CHATWOOT_DOMAIN}
  SECRET_KEY_BASE: ${SECRET_KEY_BASE}
  POSTGRES_HOST: postgres
  POSTGRES_USERNAME: chatwoot
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DATABASE: chatwoot_production
  REDIS_URL: redis://redis:6379
  RAILS_ENV: production
  EVOLUTION_API_URL: ${EVOLUTION_API_URL}
  EVOLUTION_API_TOKEN: ${EVOLUTION_API_TOKEN}

services:
  rails:
    image: dariobastosdev/chatwoot:latest
    command: bundle exec rails s -p 3000 -b '0.0.0.0'
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    networks:
      - traefik-network
      - chatwoot-internal
    environment:
      <<: *base-config
      # DEZENAS: Configuração leve
      WEB_CONCURRENCY: 0 # Single process
      RAILS_MAX_THREADS: 5 # 5 threads
      POSTGRES_POOL: 10
    labels:
      # Traefik - Roteamento principal
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-network"

      # HTTP Router
      - "traefik.http.routers.chatwoot.rule=Host(`${CHATWOOT_DOMAIN}`)"
      - "traefik.http.routers.chatwoot.entrypoints=websecure"
      - "traefik.http.routers.chatwoot.tls=true"
      - "traefik.http.routers.chatwoot.tls.certresolver=letsencrypt"

      # Service
      - "traefik.http.services.chatwoot.loadbalancer.server.port=3000"
      - "traefik.http.services.chatwoot.loadbalancer.sticky.cookie=true"
      - "traefik.http.services.chatwoot.loadbalancer.sticky.cookie.name=chatwoot_sticky"

      # Health check
      - "traefik.http.services.chatwoot.loadbalancer.healthcheck.path=/api"
      - "traefik.http.services.chatwoot.loadbalancer.healthcheck.interval=10s"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G

  sidekiq:
    image: dariobastosdev/chatwoot:latest
    command: bundle exec sidekiq
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    networks:
      - chatwoot-internal
    environment:
      <<: *base-config
      SIDEKIQ_CONCURRENCY: 10
      POSTGRES_POOL: 15
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    networks:
      - chatwoot-internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chatwoot_production
    command: >
      postgres
      -c max_connections=50
      -c shared_buffers=256MB
      -c work_mem=4MB
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - chatwoot-internal
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

volumes:
  postgres_data:
  redis_data:
