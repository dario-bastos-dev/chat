# ============================================================
# 📊 TABELA RESUMO DE CONFIGURAÇÕES
# ============================================================
#
# | Escala    | Rails              | Sidekiq       | Postgres     | Redis  | Servidor          |
# |-----------|-------------------|---------------|--------------|--------|-------------------|
# | DEZENAS   | 1×(1×5)=5 threads | 1×10 jobs     | 50 conn      | 256MB  | 2 CPU, 4GB        |
# | CENTENAS  | 2×(4×10)=80       | 2×25=50 jobs  | 200 conn     | 1GB    | 4 CPU, 8GB        |
# | MILHARES  | 4×(4×15)=240      | 4×30=120 jobs | 500 conn     | 4GB    | 8+ CPU, 16GB+     |
# | MILHÕES   | 10×(4×20)=800     | 8×30=240 jobs | RDS          | Cluster| Multi-node/K8s    |
#
# ============================================================
# 📈 CAPACIDADES ESTIMADAS
# ============================================================
#
# | Escala    | HTTP/s | Msg Evolution/min | Webhooks/s | Usuários Ativos |
# |-----------|--------|-------------------|------------|-----------------|
# | DEZENAS   | ~5     | ~100              | ~10        | 10-50           |
# | CENTENAS  | ~40    | ~1000             | ~100       | 100-500         |
# | MILHARES  | ~200   | ~5000             | ~500       | 1000-10000      |
# | MILHÕES   | ~2000+ | ~50000+           | ~2000+     | 100k+           |
#
# ============================================================
# 🔧 MIDDLEWARES TRAEFIK UTILIZADOS
# ============================================================
#
# ratelimit    - Limita requisições por IP
# compress     - Compressão gzip/brotli
# retry        - Retry automático em falhas
# headers      - Headers de segurança (HSTS, XSS, etc)
# circuitbreaker - Abre circuito se muitos erros 5xx
#
# ============================================================
