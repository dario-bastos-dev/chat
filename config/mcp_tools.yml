# Tools exposed by the MCP server (POST /api/v1/accounts/:account_id/mcp).
#
# Each tool calls an existing REST endpoint of the account with the caller's own credentials, so permissions,
# validations and feature flags are the same as for the API. Nothing here can delete data.
#
#   method      HTTP verb of the endpoint. Only GET tools are available while MCP_SERVER_READ_ONLY is on.
#   path        Endpoint below /api/v1/accounts/:account_id. {name} segments are filled from numeric arguments.
#   body_key    Nest the remaining arguments under this key, for endpoints that expect `{ label: { ... } }`.
#   destructive Whether the tool may overwrite existing data. Clients use it to ask for confirmation. Tools that
#               change data are destructive unless they say `destructive: false`, which only creating tools do.
#   open_world  The tool reaches people outside of Chatwoot, for example by sending a message to a customer.
#   parameters  JSON Schema properties of the tool arguments.
#   required    Names of the arguments the caller must send.

# ------- Reading ------- #
- name: list_inboxes
  description: List the inboxes (channels) of the account the user can access.
  method: get
  path: inboxes

- name: list_agents
  description: List the agents of the account.
  method: get
  path: agents

- name: list_teams
  description: List the teams of the account.
  method: get
  path: teams

- name: list_labels
  description: List the labels of the account.
  method: get
  path: labels

- name: list_custom_attribute_definitions
  description: List the custom attributes defined for conversations or contacts, with their keys and types.
  method: get
  path: custom_attribute_definitions
  parameters:
    attribute_model:
      type: string
      enum: [conversation_attribute, contact_attribute]
      description: Which kind of attribute to list. Defaults to conversation_attribute.

- name: list_contacts
  description: List contacts, 15 per page.
  method: get
  path: contacts
  parameters:
    page: &page
      type: integer
      minimum: 1
      description: Page number, starting at 1.
    sort:
      type: string
      enum: [name, -name, email, -email, phone_number, -phone_number, last_activity_at, -last_activity_at, created_at, -created_at]
      description: Sort field. A leading minus sorts in descending order.
    labels:
      type: array
      items: { type: string }
      description: Only contacts that have any of these labels.

- name: search_contacts
  description: Search contacts by name, email, phone number or identifier.
  method: get
  path: contacts/search
  parameters:
    q:
      type: string
      description: Text to look for.
    page: *page
  required: [q]

- name: get_contact
  description: Get one contact, including its custom attributes and the inboxes it can be reached through.
  method: get
  path: contacts/{contact_id}
  parameters:
    contact_id: &contact_id
      type: integer
      description: Contact id.
  required: [contact_id]

- name: list_contact_conversations
  description: List the conversations of a contact.
  method: get
  path: contacts/{contact_id}/conversations
  parameters:
    contact_id: *contact_id
  required: [contact_id]

- name: list_conversations
  description: List conversations, 25 per page. Only open conversations are returned unless a status is given.
  method: get
  path: conversations
  parameters:
    status:
      type: string
      enum: [open, resolved, pending, snoozed, all]
      description: Conversation status. Defaults to open.
    assignee_type:
      type: string
      enum: [me, unassigned, assigned, all]
      description: Filter by who the conversation is assigned to. Defaults to all.
    inbox_id:
      type: integer
      description: Only conversations of this inbox.
    team_id:
      type: integer
      description: Only conversations of this team.
    labels:
      type: array
      items: { type: string }
      description: Only conversations that have all of these labels.
    q:
      type: string
      description: Search text matched against messages and contact details. Ignores the status filter.
    page: *page

- name: get_conversation_counts
  description: Count conversations by assignment (mine, unassigned, assigned, all) for a status.
  method: get
  path: conversations/meta
  parameters:
    status:
      type: string
      enum: [open, resolved, pending, snoozed, all]
      description: Conversation status. Defaults to open.
    inbox_id:
      type: integer
      description: Only conversations of this inbox.
    team_id:
      type: integer
      description: Only conversations of this team.

- name: get_conversation
  description: Get one conversation by its display id, with its contact, assignee, labels and custom attributes.
  method: get
  path: conversations/{conversation_id}
  parameters:
    conversation_id: &conversation_id
      type: integer
      description: Conversation display id, the number shown in the dashboard.
  required: [conversation_id]

- name: list_messages
  description: Get the latest 20 messages of a conversation in chronological order. Use before to page back to older ones.
  method: get
  path: conversations/{conversation_id}/messages
  parameters:
    conversation_id: *conversation_id
    before:
      type: integer
      description: Return the messages that come before this message id.
    after:
      type: integer
      description: Return the messages that come after this message id.
  required: [conversation_id]

# ------- Writing ------- #
- name: create_contact
  description: Create a contact. Pass inbox_id to also make it reachable through that inbox.
  method: post
  path: contacts
  destructive: false
  parameters:
    name:
      type: string
      description: Contact name.
    email:
      type: string
      description: Email address.
    phone_number:
      type: string
      description: Phone number in E.164 format, for example +5511999999999.
    identifier:
      type: string
      description: Your own unique identifier for the contact.
    inbox_id:
      type: integer
      description: Inbox the contact should be reachable through.
    custom_attributes:
      type: object
      description: Custom attribute values keyed by attribute key.
    additional_attributes:
      type: object
      description: Extra details such as city, country or company name.

- name: update_contact
  description: Update a contact. Custom attributes are merged with the existing ones.
  method: patch
  path: contacts/{contact_id}
  parameters:
    contact_id: *contact_id
    name:
      type: string
      description: Contact name.
    email:
      type: string
      description: Email address.
    phone_number:
      type: string
      description: Phone number in E.164 format, for example +5511999999999.
    identifier:
      type: string
      description: Your own unique identifier for the contact.
    blocked:
      type: boolean
      description: Block the contact so it can no longer start conversations.
    custom_attributes:
      type: object
      description: Custom attribute values keyed by attribute key.
    additional_attributes:
      type: object
      description: Extra details such as city, country or company name.
  required: [contact_id]

- name: set_contact_labels
  description: Replace all the labels of a contact with the given list.
  method: post
  path: contacts/{contact_id}/labels
  parameters:
    contact_id: *contact_id
    labels:
      type: array
      items: { type: string }
      description: Label titles. Send an empty list to remove every label.
  required: [contact_id, labels]

- name: create_conversation
  description: Start a conversation for a contact in an inbox, optionally with a first outgoing message.
  method: post
  path: conversations
  destructive: false
  open_world: true
  parameters:
    inbox_id:
      type: integer
      description: Inbox the conversation belongs to.
    contact_id:
      type: integer
      description: Contact that owns the conversation.
    source_id:
      type: string
      description: Contact address in that inbox, such as the phone number or email. Optional when the contact already has one.
    status:
      type: string
      enum: [open, resolved, pending, snoozed]
      description: Initial status. Defaults to open.
    assignee_id:
      type: integer
      description: Agent that should own the conversation.
    team_id:
      type: integer
      description: Team that should own the conversation.
    message:
      type: object
      description: First message to send, with its text in content.
      properties:
        content:
          type: string
          description: Message text.
  required: [inbox_id, contact_id]

- name: send_message
  description: Send a message in a conversation, or add a private note that only agents can see.
  method: post
  path: conversations/{conversation_id}/messages
  destructive: false
  open_world: true
  parameters:
    conversation_id: *conversation_id
    content:
      type: string
      description: Message text.
    private:
      type: boolean
      description: Send as a private note instead of a reply to the customer. Defaults to false.
  required: [conversation_id, content]

- name: set_conversation_status
  description: Change the status of a conversation.
  method: post
  path: conversations/{conversation_id}/toggle_status
  parameters:
    conversation_id: *conversation_id
    status:
      type: string
      enum: [open, resolved, pending, snoozed]
      description: New status.
    snoozed_until:
      type: string
      description: ISO 8601 date and time the conversation should reopen. Only for the snoozed status.
  required: [conversation_id, status]

- name: assign_conversation
  description: Assign a conversation to an agent, to a team, or both.
  method: post
  path: conversations/{conversation_id}/assignments
  parameters:
    conversation_id: *conversation_id
    assignee_id:
      type: integer
      description: Agent id. Send null to unassign the agent.
    team_id:
      type: integer
      description: Team id. Send 0 to remove the team.
  required: [conversation_id]

- name: set_conversation_priority
  description: Set the priority of a conversation.
  method: post
  path: conversations/{conversation_id}/toggle_priority
  parameters:
    conversation_id: *conversation_id
    priority:
      type: string
      enum: [low, medium, high, urgent]
      description: New priority. Leave it out to clear the priority.
  required: [conversation_id]

- name: set_conversation_labels
  description: Replace all the labels of a conversation with the given list.
  method: post
  path: conversations/{conversation_id}/labels
  parameters:
    conversation_id: *conversation_id
    labels:
      type: array
      items: { type: string }
      description: Label titles. Send an empty list to remove every label.
  required: [conversation_id, labels]

- name: set_conversation_custom_attributes
  description: Set custom attribute values on a conversation. Values are merged with the existing ones.
  method: post
  path: conversations/{conversation_id}/custom_attributes
  parameters:
    conversation_id: *conversation_id
    custom_attributes:
      type: object
      description: Custom attribute values keyed by attribute key.
  required: [conversation_id, custom_attributes]

- name: create_label
  description: Create a label.
  method: post
  path: labels
  destructive: false
  body_key: label
  parameters:
    title:
      type: string
      description: Label title. Letters, numbers, hyphens and underscores, without spaces.
    description:
      type: string
      description: What the label is for.
    color:
      type: string
      description: Hex color, for example "#1f93ff".
    show_on_sidebar:
      type: boolean
      description: Show the label in the dashboard sidebar.
  required: [title]

- name: update_label
  description: Update a label.
  method: patch
  path: labels/{label_id}
  body_key: label
  parameters:
    label_id:
      type: integer
      description: Label id.
    title:
      type: string
      description: Label title. Letters, numbers, hyphens and underscores, without spaces.
    description:
      type: string
      description: What the label is for.
    color:
      type: string
      description: Hex color, for example "#1f93ff".
    show_on_sidebar:
      type: boolean
      description: Show the label in the dashboard sidebar.
  required: [label_id]
